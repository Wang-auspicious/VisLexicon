<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carbon primary button preview</title>
<style>
  :root { font-family: "IBM Plex Sans", system-ui, sans-serif; color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; }
  button { box-sizing: border-box; display: inline-flex; position: relative; justify-content: space-between; align-items: normal; width: 123.5px; height: 48px; margin: 0; padding: 14px 63px 14px 15px; border: 1px solid transparent; border-radius: 0; background: rgb(15, 98, 254); color: #fff; font: 400 14px/18.0001px "IBM Plex Sans", system-ui, sans-serif; letter-spacing: .16px; cursor: pointer; transition: background .07s cubic-bezier(0,0,.38,.9), box-shadow .07s cubic-bezier(0,0,.38,.9), border-color .07s cubic-bezier(0,0,.38,.9), outline .07s cubic-bezier(0,0,.38,.9); }
  button:hover { background: rgb(0, 80, 230); }
  button:active { background: rgb(0, 45, 156); }
  button:focus { border-color: rgb(15, 98, 254); box-shadow: inset 0 0 0 1px rgb(15, 98, 254), inset 0 0 0 2px #fff; outline: none; }
  @media (prefers-reduced-motion: reduce) { button { transition: background .07s cubic-bezier(0,0,.38,.9), box-shadow .07s cubic-bezier(0,0,.38,.9), border-color .07s cubic-bezier(0,0,.38,.9), outline .07s cubic-bezier(0,0,.38,.9); } }
</style>
<button type="button">Button</button>
