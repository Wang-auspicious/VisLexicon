<!doctype html><meta charset="utf-8"><title>Ghost button reconstruction</title><style>
:root{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#292930;background:#fff}body{margin:0;padding:32px}.stage{display:flex;align-items:center;justify-content:center;min-height:120px;background:#fff}.ghost{appearance:none;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 16px;border:1px solid transparent;border-radius:4px;background:transparent;color:oklch(0.21 0.006 285.885);font:600 14px/24.5px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Vazirmatn,Arial,"Noto Sans",sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji";cursor:pointer;box-shadow:oklch(0 0 0 / 0) 0px 0px 0px 0px inset,oklch(0 0 0 / 0) 0px 0px 0px 0px;outline-offset:2px;transition-property:color,background-color,border-color,box-shadow,transform;transition-duration:.2s;transition-timing-function:cubic-bezier(0,0,.2,1)}.ghost:hover{background:oklab(.9114 0 0);border-color:oklab(.86583 0 0);box-shadow:oklch(1 0 0 / .06) 0px .5px 0px .5px inset,oklab(.9114 0 0 / .3) 0px 3px 2px -2px,oklab(.9114 0 0 / .3) 0px 4px 3px -2px}.ghost:focus-visible{outline:2px solid oklch(.21 .006 285.885);outline-offset:2px;background:oklch(.98 0 0);border-color:oklab(.931 0 0);box-shadow:oklch(1 0 0 / .06) 0px .5px 0px .5px inset,oklab(.98 0 0 / .3) 0px 3px 2px -2px,oklab(.98 0 0 / .3) 0px 4px 3px -2px}.ghost:active{background:oklab(.931 0 0);border-color:oklab(.9114 0 0);box-shadow:oklch(0 0 0 / 0) 0px 0px 0px 0px inset,oklch(0 0 0 / 0) 0px 0px 0px 0px;translate:0 .5px}@media(max-width:600px){.ghost{line-height:24px}}
</style><main class="stage"><button class="ghost" type="button">Ghost</button></main>
