<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:"><style>html,body{margin:0;height:100%;background:#fff;color:#23232f;font-family:system-ui}body{display:flex;align-items:center;justify-content:center;overflow:hidden}*{box-sizing:border-box}button{font-family:inherit}.stage{width:90%;height:90%;display:flex;align-items:center;justify-content:center;overflow:hidden;--fx-accent:#e8879c;--fx-sans:system-ui;--fx-mono:monospace}.fx>b,.fx>i,.fx>u{display:none}.fxchat{width:min(410px,86%);display:flex;flex-direction:column;gap:12px}.fx{max-width:84%;padding:12px 14px;border-radius:14px;background:#f2f3f5;font:400 14px/1.5 var(--fx-sans,system-ui);color:#23232f}.fx:nth-child(2){align-self:flex-end;background:linear-gradient(150deg,#5590ad,#3f6f92);color:#fff}
