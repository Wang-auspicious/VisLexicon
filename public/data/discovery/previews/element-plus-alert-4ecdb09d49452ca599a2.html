<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Element Plus unclosable Success Alert preview</title><style>
@font-face{font-family:Inter;src:url('../../../fonts/inter-variable-latin.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:block}
*{box-sizing:border-box}html,body{margin:0;min-width:0;min-height:100%;background:#fff;font-family:Inter,"Helvetica Neue",Helvetica,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",微软雅黑,Arial,sans-serif}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff}.stage{width:600px;max-width:100%}
#target{position:relative;display:flex;align-items:center;overflow:hidden;width:100%;height:40px;padding:8px 16px;border:0 none rgb(103,194,58);border-radius:4px;background:rgb(240,249,235);color:rgb(103,194,58);font-size:16px;font-weight:400;line-height:22.4px;box-shadow:none;transition:opacity .2s ease}
.el-alert__content{display:flex;flex-direction:column;min-width:0;gap:4px}.el-alert__title{display:block;color:rgb(103,194,58);font-family:Inter,"Helvetica Neue",Helvetica,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",微软雅黑,Arial,sans-serif;font-size:14px;font-weight:400;line-height:24px;letter-spacing:normal}
@media(max-width:600px){.stage{width:291px}}
</style></head><body><main><div class="stage"><div id="target" class="el-alert el-alert--success is-light" role="alert"><div class="el-alert__content"><span class="el-alert__title">Unclosable alert</span></div></div></div></main></body></html>
