<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="VisLexicon">
  <rect width="32" height="32" rx="7" fill="#171614"/>
  <!-- 三条不等长横线 = 一页词条的三行；右侧一枚方点 = 被核验过的那一条 -->
  <g fill="#f6f5f2">
    <rect x="7" y="9"  width="18" height="2.6" rx="1.3"/>
    <rect x="7" y="14.7" width="12" height="2.6" rx="1.3"/>
    <rect x="7" y="20.4" width="8"  height="2.6" rx="1.3"/>
  </g>
  <rect x="21" y="19.4" width="4.6" height="4.6" rx="1.4" fill="#0a6b43"/>
</svg>
