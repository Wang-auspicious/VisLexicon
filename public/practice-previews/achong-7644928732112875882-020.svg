<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
<title id="t">Three rules off the headline, every block banded</title>
<desc id="d">A giant glyph sits between a top rule and a baseline rule, with a coral midline halving its face. To the right, three bars fill the upper band and one green line of type fills the lower band, all flush to the rules.</desc>
<rect width="1280" height="800" fill="#e7e9df"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif">
<text x="90" y="640" font-size="545" fill="#283128">容</text>
<line x1="40" y1="160" x2="1240" y2="160" stroke="#61724f" stroke-width="10"/>
<line x1="40" y1="400" x2="1240" y2="400" stroke="#dc7858" stroke-width="10"/>
<line x1="40" y1="640" x2="1240" y2="640" stroke="#61724f" stroke-width="10"/>
<rect x="660" y="160" width="560" height="64" fill="#b7bdb0"/>
<rect x="660" y="248" width="520" height="64" fill="#b7bdb0"/>
<rect x="660" y="336" width="480" height="64" fill="#b7bdb0"/>
<rect x="660" y="400" width="560" height="240" fill="#61724f"/>
<text x="690" y="560" font-size="130" fill="#e7e9df">STRONG</text>
</g>
</svg>