<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
<title id="t">Align to the optical centre, not the bounding box</title>
<desc id="d">One dashed axis runs down the page. The upper shape is centred by its bounding box and sits heavy on the right; the lower shape is shifted left until its visual mass balances on the same axis.</desc>
<rect width="1280" height="800" fill="#e7e9df"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif">
<line x1="640" y1="110" x2="640" y2="660" stroke="#dc7858" stroke-width="6" stroke-dasharray="22 18"/>
<rect x="465" y="170" width="250" height="200" rx="12" fill="#b7bdb0"/>
<rect x="715" y="225" width="100" height="90" rx="45" fill="none" stroke="#818879" stroke-width="14"/>
<rect x="415" y="440" width="250" height="200" rx="12" fill="#61724f"/>
<rect x="665" y="495" width="100" height="90" rx="45" fill="none" stroke="#818879" stroke-width="14"/>
<text x="465" y="430" font-size="60" fill="#818879">BOX CENTRE</text>
<text x="415" y="720" font-size="60" fill="#61724f">MASS CENTRE</text>
</g>
</svg>