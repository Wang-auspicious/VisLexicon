<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
<title id="t">Size the display line to the group height</title>
<desc id="d">A display letter beside a four-line text group. Two rules run across the layout, the upper on the group's first cap line, the lower on its last baseline; the letter's height is exactly the distance between them, measured once in coral.</desc>
<rect width="1280" height="800" fill="#e7e9df"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif">
<line x1="60" y1="180" x2="1240" y2="180" stroke="#c3cbbb" stroke-width="7"/>
<line x1="60" y1="620" x2="1240" y2="620" stroke="#c3cbbb" stroke-width="7"/>
<line x1="555" y1="140" x2="555" y2="660" stroke="#c3cbbb" stroke-width="6" stroke-dasharray="18 16"/>
<rect x="130" y="180" width="92" height="440" fill="#283128"/>
<rect x="458" y="180" width="92" height="440" fill="#283128"/>
<rect x="130" y="364" width="420" height="92" fill="#283128"/>
<text x="575" y="247" font-size="96" fill="#818879">DECEMBER</text>
<text x="575" y="371" font-size="96" fill="#818879">WINTER</text>
<text x="575" y="496" font-size="96" fill="#818879">HALL B</text>
<text x="575" y="620" font-size="96" fill="#818879">12 / 30</text>
<line x1="72" y1="196" x2="72" y2="604" stroke="#dc7858" stroke-width="10"/>
<polygon points="72,164 58,192 86,192" fill="#dc7858"/>
<polygon points="72,636 58,608 86,608" fill="#dc7858"/>
</g>
</svg>