<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
<title id="t">Repeat one small line across an even baseline grid</title>
<desc id="d">Five evenly spaced rules; the same small line drops onto three of them with a sideways offset, and the headline's baseline lands on the coral rule.</desc>
<rect width="1280" height="800" fill="#e7e9df"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif">
<line x1="90" y1="160" x2="1190" y2="160" stroke="#c3cbbb" stroke-width="6"/>
<line x1="90" y1="270" x2="1190" y2="270" stroke="#c3cbbb" stroke-width="6"/>
<line x1="90" y1="380" x2="1190" y2="380" stroke="#dc7858" stroke-width="6"/>
<line x1="90" y1="490" x2="1190" y2="490" stroke="#c3cbbb" stroke-width="6"/>
<line x1="90" y1="600" x2="1190" y2="600" stroke="#c3cbbb" stroke-width="6"/>
<text x="110" y="160" font-size="62" fill="#818879">TUTORIAL FONTS</text>
<text x="720" y="490" font-size="62" fill="#818879">SENSE OF FONT</text>
<text x="110" y="600" font-size="62" fill="#818879">TUTORIAL FONTS</text>
<text x="110" y="380" font-size="150" fill="#283128">TYPE SCALE</text>
</g>
</svg>