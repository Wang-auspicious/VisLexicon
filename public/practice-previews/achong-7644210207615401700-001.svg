<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
  <title id="t">Quarter the leading</title>
  <desc id="d">One leading unit divided into four equal bands, with the first quarter marked as the smallest vertical grid step.</desc>
  <rect width="1280" height="800" fill="#e7e9df"/>
  <g font-family="Segoe UI,Microsoft YaHei,sans-serif">
    <line x1="170" y1="240" x2="1180" y2="240" stroke="#c3cbbb" stroke-width="8"/>
    <line x1="170" y1="330" x2="1180" y2="330" stroke="#c3cbbb" stroke-width="8"/>
    <line x1="170" y1="420" x2="1180" y2="420" stroke="#c3cbbb" stroke-width="8"/>
    <line x1="170" y1="510" x2="1180" y2="510" stroke="#c3cbbb" stroke-width="8"/>
    <line x1="170" y1="600" x2="1180" y2="600" stroke="#c3cbbb" stroke-width="8"/>
    <rect x="180" y="248" width="150" height="76" fill="#dc7858"/>
    <rect x="180" y="336" width="150" height="76" fill="#b7bdb0"/>
    <rect x="180" y="424" width="150" height="76" fill="#b7bdb0"/>
    <rect x="180" y="512" width="150" height="76" fill="#b7bdb0"/>
    <text x="430" y="240" font-size="130" fill="#283128">GRID</text>
    <text x="430" y="600" font-size="130" fill="#283128">GRID</text>
  </g>
</svg>