<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d"><title id="t">Draw the letters with one even-weight line</title><desc id="d">A single continuous line of constant weight walks the whole letterform, every corner rounded, strokes crossing straight through</desc><rect width="1280" height="800" fill="#e7e9df"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><path d="M340 680L340 160L480 160A130 130 0 0 1 480 420L340 420L500 420A130 130 0 0 1 500 680L340 680" fill="none" stroke="#61724f" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><circle cx="340" cy="680" r="23" fill="#dc7858"/><text x="880" y="740" font-size="96" font-weight="600" fill="#283128">Bleach</text><text x="60" y="782" font-size="58" font-weight="600" fill="#818879">ONE LINE, ONE WEIGHT</text></g></svg>