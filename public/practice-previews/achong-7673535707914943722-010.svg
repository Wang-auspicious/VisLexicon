<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
<title id="t">Break the outline where strokes meet</title>
<desc id="d">Two outlined shapes built from two rings. On the left the contoured rings cross at the waist and jam together; on the right a band of ground is erased across the waist, cutting the contour at the joint.</desc>
<rect width="1280" height="800" fill="#e7e9df"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif">
<circle cx="400" cy="330" r="105" fill="none" stroke="#818879" stroke-width="22"/>
<circle cx="400" cy="520" r="125" fill="none" stroke="#818879" stroke-width="22"/>
<circle cx="910" cy="330" r="105" fill="none" stroke="#61724f" stroke-width="22"/>
<circle cx="910" cy="520" r="125" fill="none" stroke="#61724f" stroke-width="22"/>
<rect x="750" y="408" width="320" height="36" fill="#e7e9df" stroke="#dc7858" stroke-width="6"/>
<text x="230" y="740" font-size="60" fill="#818879">SOLID JOINT</text>
<text x="740" y="740" font-size="60" fill="#61724f">CUT JOINT</text>
</g>
</svg>