<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d"><title id="t">Size each letter differently, stack them into a slope</title><desc id="d">Each letter one step larger than the last with its baseline dropped by a fixed amount, overlapping into a slope that the numeral continues</desc><rect width="1280" height="800" fill="#e7e9df"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><path d="M60 184L620 624" stroke="#dc7858" stroke-width="12" stroke-dasharray="30 24" fill="none"/><g fill="#283128"><text x="80" y="200" font-size="150" font-weight="700">B</text><text x="150" y="255" font-size="180" font-weight="700">L</text><text x="220" y="310" font-size="210" font-weight="700">E</text><text x="290" y="365" font-size="240" font-weight="700">A</text><text x="360" y="420" font-size="270" font-weight="700">C</text><text x="430" y="475" font-size="300" font-weight="700">H</text><text x="620" y="760" font-size="420" font-weight="700">77</text></g><text x="50" y="782" font-size="58" font-weight="600" fill="#818879">STEP PER LETTER</text></g></svg>