<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
  <title id="t">The widest heading line sets the measure</title>
  <desc id="d">Three heading lines at one size, the longest exactly filling the column, with a body block wrapping at that same width.</desc>
  <rect width="1280" height="800" fill="#e7e9df"/>
  <g font-family="Segoe UI,Microsoft YaHei,sans-serif">
    <line x1="150" y1="150" x2="150" y2="786" stroke="#c3cbbb" stroke-width="8"/>
    <line x1="1130" y1="150" x2="1130" y2="786" stroke="#dc7858" stroke-width="12"/>
    <text x="150" y="290" font-size="100" fill="#283128">NEVER</text>
    <text x="150" y="430" font-size="100" textLength="980" lengthAdjust="spacingAndGlyphs" fill="#283128">SEEN BEFORE NOW</text>
    <text x="150" y="570" font-size="100" fill="#283128">AGAIN</text>
    <rect x="150" y="640" width="980" height="34" fill="#b7bdb0"/>
    <rect x="150" y="694" width="740" height="34" fill="#b7bdb0"/>
    <rect x="150" y="748" width="520" height="34" fill="#b7bdb0"/>
  </g>
</svg>