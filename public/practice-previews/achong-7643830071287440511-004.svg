<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
<title id="t">字面高当字号标尺</title>
<desc id="d">四条等距横线把标题字面高等分，最小的一档小字正好占满顶格。</desc>
<rect width="1280" height="800" fill="#e7e9df"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif">
<line x1="60" y1="190" x2="1120" y2="190" stroke="#283128" stroke-width="8"/>
<line x1="60" y1="237" x2="1120" y2="237" stroke="#283128" stroke-width="8"/>
<line x1="60" y1="283" x2="1120" y2="283" stroke="#283128" stroke-width="8"/>
<line x1="60" y1="330" x2="1120" y2="330" stroke="#283128" stroke-width="8"/>
<text x="330" y="330" font-size="200" fill="#283128" textLength="760" lengthAdjust="spacingAndGlyphs">SPORTS</text>
<text x="70" y="237" font-size="66" fill="#dc7858" textLength="145" lengthAdjust="spacingAndGlyphs">CUPS</text>
</g>
</svg>