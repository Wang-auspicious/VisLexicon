<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
<title id="t">A circled headline glyph leads the block</title>
<desc id="d">Two text blocks of three bars each, every block led by a circle exactly as tall as the block. The glyph inside the circle is lifted from the headline. The first circle is coral, the second ink.</desc>
<rect width="1280" height="800" fill="#e7e9df"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif">
<circle cx="260" cy="360" r="120" fill="none" stroke="#dc7858" stroke-width="14"/>
<text x="260" y="459" font-size="225" text-anchor="middle" fill="#283128">容</text>
<rect x="460" y="240" width="740" height="60" fill="#b7bdb0"/>
<rect x="460" y="330" width="720" height="60" fill="#b7bdb0"/>
<rect x="460" y="420" width="680" height="60" fill="#b7bdb0"/>
<circle cx="260" cy="662" r="120" fill="none" stroke="#283128" stroke-width="14"/>
<text x="260" y="761" font-size="225" text-anchor="middle" fill="#283128">灵</text>
<rect x="460" y="542" width="740" height="60" fill="#b7bdb0"/>
<rect x="460" y="632" width="720" height="60" fill="#b7bdb0"/>
<rect x="460" y="722" width="680" height="60" fill="#b7bdb0"/>
</g>
</svg>