<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d"><title id="t">Rotating frames spiral the eye inward</title><desc id="d">One rectangle repeated inward, each step scaled to 0.78 and turned four degrees, leaving a clean blank at the centre</desc><rect width="1280" height="800" fill="#e7e9df"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><g fill="none" stroke-width="10"><rect x="140" y="100" width="1000" height="620" stroke="#818879"/><rect x="250" y="168" width="780" height="484" stroke="#818879" transform="rotate(4 640 410)"/><rect x="336" y="222" width="608" height="377" stroke="#818879" transform="rotate(8 640 410)"/><rect x="403" y="263" width="474" height="294" stroke="#61724f" stroke-width="12" transform="rotate(12 640 410)"/><rect x="455" y="296" width="370" height="229" stroke="#61724f" stroke-width="12" transform="rotate(16 640 410)"/><rect x="496" y="320" width="289" height="179" stroke="#61724f" stroke-width="12" transform="rotate(20 640 410)"/></g><text x="140" y="88" font-size="60" font-weight="600" fill="#61724f">BLEACH BLEACH BLEACH</text><text x="640" y="452" font-size="120" font-weight="700" fill="#283128" text-anchor="middle">66</text><text x="140" y="772" font-size="60" font-weight="500" fill="#818879">ROTATE 4 DEG / SCALE 0.78</text></g></svg>