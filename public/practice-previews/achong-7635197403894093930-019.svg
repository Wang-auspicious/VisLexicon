<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
<title id="t">Lock the grid, move the blocks</title>
<desc id="d">A four-by-four grid holding five blocks, with whole cells left empty. One block has slid along the bottom row; the cell it came from is left as a dashed outline and the move is marked once in coral.</desc>
<rect width="1280" height="800" fill="#e7e9df"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif">
<line x1="160" y1="110" x2="160" y2="750" stroke="#c3cbbb" stroke-width="6"/>
<line x1="400" y1="110" x2="400" y2="750" stroke="#c3cbbb" stroke-width="6"/>
<line x1="640" y1="110" x2="640" y2="750" stroke="#c3cbbb" stroke-width="6"/>
<line x1="880" y1="110" x2="880" y2="750" stroke="#c3cbbb" stroke-width="6"/>
<line x1="1120" y1="110" x2="1120" y2="750" stroke="#c3cbbb" stroke-width="6"/>
<line x1="160" y1="110" x2="1120" y2="110" stroke="#c3cbbb" stroke-width="6"/>
<line x1="160" y1="270" x2="1120" y2="270" stroke="#c3cbbb" stroke-width="6"/>
<line x1="160" y1="430" x2="1120" y2="430" stroke="#c3cbbb" stroke-width="6"/>
<line x1="160" y1="590" x2="1120" y2="590" stroke="#c3cbbb" stroke-width="6"/>
<line x1="160" y1="750" x2="1120" y2="750" stroke="#c3cbbb" stroke-width="6"/>
<rect x="176" y="126" width="688" height="128" fill="#283128"/>
<rect x="176" y="286" width="208" height="128" fill="#283128"/>
<rect x="416" y="446" width="448" height="128" fill="#283128"/>
<rect x="896" y="606" width="208" height="128" fill="#283128"/>
<rect x="176" y="606" width="208" height="128" fill="none" stroke="#b7bdb0" stroke-width="6" stroke-dasharray="16 14"/>
<line x1="400" y1="670" x2="868" y2="670" stroke="#dc7858" stroke-width="10"/>
<polygon points="896,670 866,654 866,686" fill="#dc7858"/>
</g>
</svg>