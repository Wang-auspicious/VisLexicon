<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
  <title id="t">小字挂在主行的基线上</title>
  <desc id="d">极小的一行字与大数字共用同一条下缘基线，整行只留一条底线。</desc>
  <rect width="1280" height="800" fill="#e7e9df"/>
  <rect x="50" y="180" width="1180" height="500" fill="#f1f3e9"/>
  <rect x="50" y="610" width="1180" height="14" fill="#dc7858"/>
  <g font-family="Segoe UI,Microsoft YaHei,sans-serif">
    <text x="110" y="610" font-size="440" font-weight="700" fill="#283128">998</text>
    <text x="870" y="610" font-size="96" font-weight="700" fill="#283128">2024</text>
  </g>
</svg>