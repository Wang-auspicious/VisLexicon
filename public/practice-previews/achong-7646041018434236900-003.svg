<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
<title id="t">Every size is row height over a whole number</title>
<desc id="d">Two equal rows between three rules. A coral dashed line bisects the first row and the word SIZE fills its upper half. In the second row three lines of type, each a third of the row, stack up to fill it exactly.</desc>
<rect width="1280" height="800" fill="#e7e9df"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif">
<line x1="120" y1="200" x2="1160" y2="200" stroke="#61724f" stroke-width="10"/>
<line x1="120" y1="440" x2="1160" y2="440" stroke="#61724f" stroke-width="10"/>
<line x1="120" y1="680" x2="1160" y2="680" stroke="#61724f" stroke-width="10"/>
<line x1="170" y1="140" x2="170" y2="700" stroke="#c3cbbb" stroke-width="6"/>
<line x1="1110" y1="140" x2="1110" y2="700" stroke="#c3cbbb" stroke-width="6"/>
<line x1="120" y1="320" x2="1160" y2="320" stroke="#dc7858" stroke-width="10" stroke-dasharray="34 22"/>
<text x="180" y="318" font-size="166" fill="#283128">SIZE</text>
<line x1="170" y1="520" x2="1160" y2="520" stroke="#c3cbbb" stroke-width="6"/>
<line x1="170" y1="600" x2="1160" y2="600" stroke="#c3cbbb" stroke-width="6"/>
<text x="180" y="518" font-size="110" fill="#283128">A THIRD</text>
<text x="180" y="598" font-size="110" fill="#283128">OF A ROW</text>
<text x="180" y="678" font-size="110" fill="#283128">EACH LINE</text>
</g>
</svg>