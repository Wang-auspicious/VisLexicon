<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
<title id="t">One base size generates the whole group</title>
<desc id="d">Four bars standing on a common floor, their heights being 1.3, 1, one third and one tenth of a single base. The base level is ruled right across the layout and marked once in coral.</desc>
<rect width="1280" height="800" fill="#e7e9df"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif">
<line x1="110" y1="210" x2="1170" y2="210" stroke="#c3cbbb" stroke-width="5" stroke-dasharray="16 14"/>
<rect x="150" y="66" width="190" height="624" fill="#61724f"/>
<rect x="410" y="210" width="190" height="480" fill="#61724f"/>
<rect x="670" y="530" width="190" height="160" fill="#61724f"/>
<rect x="930" y="642" width="190" height="48" fill="#61724f"/>
<line x1="370" y1="210" x2="640" y2="210" stroke="#dc7858" stroke-width="16"/>
<text x="245" y="770" font-size="64" fill="#283128" text-anchor="middle">A × 1.3</text>
<text x="505" y="770" font-size="64" fill="#283128" text-anchor="middle">A</text>
<text x="765" y="770" font-size="64" fill="#283128" text-anchor="middle">A ÷ 3</text>
<text x="1025" y="770" font-size="64" fill="#283128" text-anchor="middle">A ÷ 10</text>
</g>
</svg>