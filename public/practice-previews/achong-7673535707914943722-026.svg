<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
<title id="t">Two units for the hanzi, one for the Latin</title>
<desc id="d">A hanzi line measured as 2A against a Latin line measured as A: the two face heights sit in a two to one relation, marked in coral and green.</desc>
<rect width="1280" height="800" fill="#e7e9df"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif">
<line x1="80" y1="176" x2="720" y2="176" stroke="#c3cbbb" stroke-width="6"/>
<line x1="80" y1="380" x2="720" y2="380" stroke="#c3cbbb" stroke-width="6"/>
<line x1="80" y1="458" x2="760" y2="458" stroke="#c3cbbb" stroke-width="6"/>
<line x1="80" y1="560" x2="760" y2="560" stroke="#c3cbbb" stroke-width="6"/>
<text x="110" y="380" font-size="220" fill="#283128">文字</text>
<text x="110" y="560" font-size="146" fill="#283128">Graphic</text>
<line x1="790" y1="176" x2="790" y2="380" stroke="#dc7858" stroke-width="8"/>
<polygon points="790,164 782,186 798,186" fill="#dc7858"/>
<polygon points="790,392 782,370 798,370" fill="#dc7858"/>
<text x="820" y="296" font-size="62" fill="#dc7858">2A</text>
<line x1="850" y1="458" x2="850" y2="560" stroke="#61724f" stroke-width="8"/>
<text x="878" y="528" font-size="62" fill="#61724f">A</text>
</g>
</svg>