<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d"><title id="t">虚词降级：小字夹在两段实词之间</title><desc id="d">上下两块大字号承载实词，中间一块约三分之一高的窄块承载虚词，三块共用一条中轴</desc><rect width="1280" height="800" fill="#e7e9df"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><path d="M640 130V800" stroke="#c3cbbb" stroke-width="6" stroke-dasharray="26 20" fill="none"/><rect x="150" y="150" width="980" height="240" rx="18" fill="#61724f"/><rect x="150" y="574" width="980" height="196" rx="18" fill="#61724f"/><rect x="550" y="440" width="180" height="84" rx="12" fill="#dc7858"/><text x="150" y="110" font-size="88" font-weight="650" fill="#283128">SMALL WORDS</text><text x="640" y="500" font-size="60" font-weight="700" text-anchor="middle" fill="#f9f7ef">AND</text></g></svg>