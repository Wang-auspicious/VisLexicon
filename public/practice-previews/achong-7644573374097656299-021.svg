<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
<title id="t">Snap small type to the cap and baseline rules</title>
<desc id="d">A display letter with its cap line, midline and baseline ruled across the layout. The same small word is set three times, each landing on one of the rules; the version sitting on the baseline is the one kept, marked once in coral.</desc>
<rect width="1280" height="800" fill="#e7e9df"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif">
<line x1="150" y1="170" x2="1220" y2="170" stroke="#818879" stroke-width="6"/>
<line x1="150" y1="400" x2="1220" y2="400" stroke="#818879" stroke-width="6"/>
<line x1="150" y1="630" x2="1220" y2="630" stroke="#818879" stroke-width="6"/>
<rect x="200" y="170" width="84" height="460" fill="#283128"/>
<rect x="200" y="170" width="380" height="74" fill="#283128"/>
<rect x="200" y="363" width="322" height="74" fill="#283128"/>
<rect x="200" y="556" width="380" height="74" fill="#283128"/>
<text x="700" y="240" font-size="100" fill="#818879">SUMMER</text>
<text x="700" y="435" font-size="100" fill="#818879">SUMMER</text>
<text x="700" y="630" font-size="100" fill="#283128">SUMMER</text>
<line x1="690" y1="630" x2="1120" y2="630" stroke="#dc7858" stroke-width="14"/>
</g>
</svg>