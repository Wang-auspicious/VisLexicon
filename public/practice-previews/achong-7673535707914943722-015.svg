<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
<title id="t">Derive the button from the cap height</title>
<desc id="d">A pill button measured off the text: the cap height is a, the padding above the caps is 1.5b in coral, and the slack to the right of the label is 2a.</desc>
<rect width="1280" height="800" fill="#e7e9df"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif">
<rect x="280" y="290" width="720" height="190" rx="95" fill="none" stroke="#61724f" stroke-width="14"/>
<text x="430" y="420" font-size="96" fill="#283128">CART</text>
<line x1="300" y1="352" x2="1000" y2="352" stroke="#c3cbbb" stroke-width="6"/>
<line x1="300" y1="420" x2="1000" y2="420" stroke="#c3cbbb" stroke-width="6"/>
<text x="1020" y="404" font-size="62" fill="#61724f">a</text>
<line x1="240" y1="290" x2="240" y2="352" stroke="#dc7858" stroke-width="8"/>
<line x1="216" y1="290" x2="264" y2="290" stroke="#dc7858" stroke-width="8"/>
<line x1="216" y1="352" x2="264" y2="352" stroke="#dc7858" stroke-width="8"/>
<text x="60" y="336" font-size="62" fill="#dc7858">1.5b</text>
<line x1="662" y1="480" x2="1000" y2="480" stroke="#c3cbbb" stroke-width="6"/>
<text x="770" y="548" font-size="62" fill="#61724f">2a</text>
</g>
</svg>