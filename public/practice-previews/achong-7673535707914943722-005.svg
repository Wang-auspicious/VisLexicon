<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
<title id="t">Blow the figures up, demote the unit to a corner tag</title>
<desc id="d">A huge numeral pair carries the block; its unit is shrunk into a small bracketed tag tied to the figures by a leader, and the original sentence falls back to one small line.</desc>
<rect width="1280" height="800" fill="#e7e9df"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif">
<text x="80" y="520" font-size="260" fill="#283128">-30</text>
<rect x="560" y="300" width="210" height="90" fill="none" stroke="#dc7858" stroke-width="8"/>
<text x="585" y="362" font-size="62" fill="#283128">RMB</text>
<line x1="516" y1="472" x2="558" y2="392" stroke="#c3cbbb" stroke-width="6"/>
<text x="560" y="470" font-size="62" fill="#818879">SPEND 300</text>
</g>
</svg>