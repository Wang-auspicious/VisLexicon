<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
<title id="t">Stand three vertical axes, then hang the type</title>
<desc id="d">Three vertical axes divide the page; a title hangs on the coral left axis, a Latin line breaks over two rows on the middle axis, credits fill the right axis, and one line is set rotated on the first axis.</desc>
<rect width="1280" height="800" fill="#e7e9df"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif">
<line x1="200" y1="120" x2="200" y2="720" stroke="#dc7858" stroke-width="6"/>
<line x1="560" y1="120" x2="560" y2="720" stroke="#c3cbbb" stroke-width="6"/>
<line x1="920" y1="120" x2="920" y2="720" stroke="#c3cbbb" stroke-width="6"/>
<text x="200" y="300" font-size="82" fill="#283128">UNBOUND</text>
<text x="560" y="300" font-size="62" fill="#283128">GRAPHIC</text>
<text x="560" y="372" font-size="62" fill="#283128">DESIGN</text>
<text x="920" y="300" font-size="58" fill="#818879">CREDITS</text>
<text x="200" y="700" font-size="58" fill="#61724f" transform="rotate(-90 200 700)">VERTICAL</text>
</g>
</svg>