<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
<title id="t">侧标长度取大字字面高</title>
<desc id="d">两条横线夹出大写的字面高，竖排与横排的小字都取这同一个长度。</desc>
<rect width="1280" height="800" fill="#e7e9df"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif">
<line x1="120" y1="170" x2="990" y2="170" stroke="#283128" stroke-width="8"/>
<line x1="120" y1="303" x2="990" y2="303" stroke="#283128" stroke-width="8"/>
<text x="180" y="303" font-size="190" fill="#283128" textLength="740" lengthAdjust="spacingAndGlyphs">SPORTS</text>
<text x="0" y="0" transform="translate(1000,170) rotate(90)" font-size="60" fill="#283128" textLength="133" lengthAdjust="spacingAndGlyphs">CUPS</text>
<line x1="1110" y1="170" x2="1110" y2="303" stroke="#dc7858" stroke-width="8"/>
<polygon points="1110,158 1102,180 1118,180" fill="#dc7858"/>
<polygon points="1110,315 1102,293 1118,293" fill="#dc7858"/>
<text x="1140" y="252" font-size="62" fill="#dc7858">H</text>
<text x="180" y="560" font-size="60" fill="#283128" textLength="133" lengthAdjust="spacingAndGlyphs">CUPS</text>
<line x1="180" y1="600" x2="313" y2="600" stroke="#818879" stroke-width="6"/>
<line x1="180" y1="586" x2="180" y2="614" stroke="#818879" stroke-width="6"/>
<line x1="313" y1="586" x2="313" y2="614" stroke="#818879" stroke-width="6"/>
<text x="350" y="618" font-size="62" fill="#818879">H</text>
</g>
</svg>