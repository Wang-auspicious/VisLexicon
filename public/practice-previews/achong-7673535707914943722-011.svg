<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
<title id="t">Hang the pointed letter past the left margin</title>
<desc id="d">Two wordmarks share one vertical rule. The upper pair is aligned by the bounding box; in the lower pair the first letter alone is pushed left so its apex crosses the rule, with the overhang marked in coral.</desc>
<rect width="1280" height="800" fill="#e7e9df"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif">
<line x1="400" y1="110" x2="400" y2="720" stroke="#c3cbbb" stroke-width="6"/>
<text x="400" y="240" font-size="110" fill="#283128">ACHONG</text>
<text x="400" y="360" font-size="110" fill="#283128">DESIGN</text>
<text x="310" y="570" font-size="110" fill="#283128">ACHONG</text>
<text x="400" y="690" font-size="110" fill="#283128">DESIGN</text>
<line x1="310" y1="620" x2="400" y2="620" stroke="#dc7858" stroke-width="8"/>
<line x1="310" y1="598" x2="310" y2="642" stroke="#dc7858" stroke-width="8"/>
<line x1="400" y1="598" x2="400" y2="642" stroke="#dc7858" stroke-width="8"/>
<text x="900" y="240" font-size="58" fill="#818879">BOX</text>
<text x="900" y="570" font-size="58" fill="#61724f">HANG</text>
</g>
</svg>