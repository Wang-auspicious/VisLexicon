<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
  <title id="t">最小的数值放到最大</title>
  <desc id="d">9W 是全表最小的数值却被放到整页最大，两个原本抢眼的百分比退成右侧一行小字。</desc>
  <rect width="1280" height="800" fill="#e7e9df"/>
  <rect x="40" y="150" width="960" height="520" fill="#f1f3e9"/>
  <rect x="76" y="217" width="22" height="403" fill="#dc7858"/>
  <rect x="1000" y="335" width="22" height="45" fill="#c3cbbb"/>
  <g font-family="Segoe UI,Microsoft YaHei,sans-serif">
    <text x="140" y="620" font-size="560" font-weight="700" fill="#283128">9W</text>
    <text x="1040" y="380" font-size="62" fill="#818879">85%</text>
    <text x="1040" y="470" font-size="62" fill="#818879">20x</text>
  </g>
</svg>