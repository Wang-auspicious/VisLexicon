<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
<title id="t">中西文按字面高配对</title>
<desc id="d">同一对横线夹住汉字与拉丁大写：同字号时汉字冒头，把汉字调小之后两者齐平。</desc>
<rect width="1280" height="800" fill="#e7e9df"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif">
<line x1="60" y1="190" x2="1240" y2="190" stroke="#dc7858" stroke-width="12"/>
<line x1="60" y1="330" x2="1240" y2="330" stroke="#dc7858" stroke-width="12"/>
<text x="90" y="330" font-size="165" fill="#283128">智能</text>
<text x="520" y="330" font-size="200" fill="#283128" textLength="700" lengthAdjust="spacingAndGlyphs">SPORTS</text>
<line x1="60" y1="500" x2="1240" y2="500" stroke="#c3cbbb" stroke-width="8"/>
<line x1="60" y1="640" x2="1240" y2="640" stroke="#c3cbbb" stroke-width="8"/>
<text x="90" y="640" font-size="200" fill="#b7bdb0">智能</text>
<text x="520" y="640" font-size="200" fill="#b7bdb0" textLength="700" lengthAdjust="spacingAndGlyphs">SPORTS</text>
</g>
</svg>