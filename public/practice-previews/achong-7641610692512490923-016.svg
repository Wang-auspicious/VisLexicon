<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
<title id="t">Let the small block's width set the indent</title>
<desc id="d">A two-line label sits left of a vertical rule; the headline and the line above it start exactly one label width further in.</desc>
<rect width="1280" height="800" fill="#e7e9df"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif">
<line x1="240" y1="140" x2="240" y2="680" stroke="#c3cbbb" stroke-width="6"/>
<text x="108" y="330" font-size="58" fill="#818879">GRID</text>
<text x="108" y="395" font-size="58" fill="#818879">NOTE</text>
<text x="240" y="320" font-size="62" fill="#818879">SUBTITLE</text>
<text x="240" y="470" font-size="150" fill="#283128">HEADLINE</text>
<line x1="108" y1="580" x2="240" y2="580" stroke="#dc7858" stroke-width="8"/>
<line x1="108" y1="556" x2="108" y2="604" stroke="#dc7858" stroke-width="8"/>
<line x1="240" y1="556" x2="240" y2="604" stroke="#dc7858" stroke-width="8"/>
</g>
</svg>