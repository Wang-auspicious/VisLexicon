<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d"><title id="t">共同基线把两组日期连成一条</title><desc id="d">两组日期各自把重复的年份降到共同基线之下，变化的月日留在主线上</desc><rect width="1280" height="800" fill="#e7e9df"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><path d="M100 450H1180" stroke="#c3cbbb" stroke-width="7" fill="none"/><path d="M100 560H1180" stroke="#c3cbbb" stroke-width="5" stroke-dasharray="24 18" fill="none"/><text x="120" y="450" font-size="176" font-weight="650" fill="#283128">12/30</text><text x="700" y="450" font-size="176" font-weight="650" fill="#283128">05/31</text><text x="120" y="560" font-size="64" font-weight="600" fill="#dc7858">2017</text><text x="700" y="560" font-size="64" font-weight="600" fill="#dc7858">2018</text></g></svg>