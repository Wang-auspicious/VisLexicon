<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d"><title id="t">硬断单词，用行数换宽度</title><desc id="d">同一个词排成一行时是一条很长的横条，硬断成三行后收成一块竖长的字块，末行空位放下序号</desc><rect width="1280" height="800" fill="#e7e9df"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><rect x="380" y="70" width="790" height="86" rx="8" fill="#b7bdb0"/><rect x="340" y="200" width="540" height="560" fill="none" stroke="#c3cbbb" stroke-width="7" stroke-dasharray="24 18"/><text x="380" y="350" font-size="190" font-weight="700" fill="#283128">PO</text><text x="380" y="550" font-size="190" font-weight="700" fill="#283128">STE</text><text x="380" y="750" font-size="190" font-weight="700" fill="#283128">R<tspan fill="#dc7858">38</tspan></text></g></svg>