<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
<title id="t">Lift the colon and hyphen inside figures</title>
<desc id="d">A time range set large. The baseline and the figure midline are ruled; the colon and hyphen sit on the midline instead of the baseline, with the lift marked once in coral and a grey tick left where the mark used to fall.</desc>
<rect width="1280" height="800" fill="#e7e9df"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif">
<line x1="60" y1="474" x2="1220" y2="474" stroke="#c3cbbb" stroke-width="6"/>
<line x1="60" y1="540" x2="1220" y2="540" stroke="#c3cbbb" stroke-width="6"/>
<text x="90" y="540" font-size="150" fill="#283128">20</text>
<text x="285" y="474" font-size="150" fill="#283128">:</text>
<text x="350" y="540" font-size="150" fill="#283128">00</text>
<text x="560" y="474" font-size="150" fill="#283128">-</text>
<text x="680" y="540" font-size="150" fill="#283128">22</text>
<text x="880" y="474" font-size="150" fill="#283128">:</text>
<text x="945" y="540" font-size="150" fill="#283128">00</text>
<rect x="286" y="500" width="34" height="34" rx="8" fill="#b7bdb0"/>
<line x1="1150" y1="474" x2="1150" y2="540" stroke="#dc7858" stroke-width="8"/>
<polygon points="1150,462 1142,482 1158,482" fill="#dc7858"/>
<polygon points="1150,552 1142,532 1158,532" fill="#dc7858"/>
</g>
</svg>