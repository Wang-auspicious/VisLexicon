<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
  <title id="t">A small group totals the big face height</title>
  <desc id="d">A large numeral and a two-line small group share exactly the same top and bottom edge.</desc>
  <rect width="1280" height="800" fill="#e7e9df"/>
  <g font-family="Segoe UI,Microsoft YaHei,sans-serif">
    <line x1="40" y1="360" x2="1240" y2="360" stroke="#dc7858" stroke-width="12"/>
    <line x1="40" y1="640" x2="1240" y2="640" stroke="#dc7858" stroke-width="12"/>
    <text x="60" y="640" font-size="400" fill="#283128">100</text>
    <text x="800" y="479" font-size="170" fill="#283128">PURE</text>
    <text x="800" y="640" font-size="170" fill="#283128">MILK</text>
  </g>
</svg>