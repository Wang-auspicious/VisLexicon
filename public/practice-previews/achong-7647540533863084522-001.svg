<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
  <title id="t">Flush both ends</title>
  <desc id="d">Two heading lines of different sizes stretched to one identical pair of left and right edges.</desc>
  <rect width="1280" height="800" fill="#e7e9df"/>
  <g font-family="Segoe UI,Microsoft YaHei,sans-serif">
    <line x1="150" y1="130" x2="150" y2="590" stroke="#dc7858" stroke-width="12"/>
    <line x1="1050" y1="130" x2="1050" y2="590" stroke="#dc7858" stroke-width="12"/>
    <text x="150" y="340" font-size="210" textLength="900" lengthAdjust="spacingAndGlyphs" fill="#283128">DONUTS</text>
    <text x="150" y="540" font-size="141" textLength="900" lengthAdjust="spacingAndGlyphs" fill="#283128">CHOCOLATE</text>
    <text x="1240" y="340" font-size="72" text-anchor="end" fill="#818879">6</text>
    <text x="1240" y="540" font-size="72" text-anchor="end" fill="#818879">9</text>
  </g>
</svg>