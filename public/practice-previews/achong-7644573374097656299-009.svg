<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
<title id="t">Every line fills the same two side edges</title>
<desc id="d">Three lines held between two vertical rules, every one of them reaching both. The short word is opened out by tracking, the figures are enlarged, the long word is set naturally, and the shared width is measured once in coral.</desc>
<rect width="1280" height="800" fill="#e7e9df"/>
<g font-family="Segoe UI,Microsoft YaHei,sans-serif">
<line x1="260" y1="120" x2="260" y2="700" stroke="#818879" stroke-width="7"/>
<line x1="1020" y1="120" x2="1020" y2="700" stroke="#818879" stroke-width="7"/>
<text x="260" y="307" font-size="110" fill="#283128" textLength="760" lengthAdjust="spacing">SEPTEMBER</text>
<text x="260" y="420" font-size="78" fill="#818879" textLength="760" lengthAdjust="spacing">SUMMER</text>
<text x="260" y="640" font-size="235" fill="#283128" textLength="760" lengthAdjust="spacing">12 / 30</text>
<line x1="278" y1="150" x2="1002" y2="150" stroke="#dc7858" stroke-width="9"/>
<polygon points="260,150 288,134 288,166" fill="#dc7858"/>
<polygon points="1020,150 992,134 992,166" fill="#dc7858"/>
</g>
</svg>