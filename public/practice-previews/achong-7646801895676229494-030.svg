<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d">
  <title id="t">黄金比切分上下两块</title>
  <desc id="d">两组文字纵向叠放，一条横线在 0.618 处把整组切成 1.618 比 1 的上下两段。</desc>
  <rect width="1280" height="800" fill="#e7e9df"/>
  <rect x="70" y="70" width="830" height="408" fill="#61724f"/>
  <rect x="70" y="478" width="830" height="252" fill="#b7bdb0"/>
  <rect x="50" y="470" width="920" height="16" fill="#dc7858"/>
  <g stroke="#c3cbbb" stroke-width="6" fill="none">
    <line x1="980" y1="70" x2="980" y2="730"/>
    <line x1="962" y1="70" x2="998" y2="70"/>
    <line x1="962" y1="478" x2="998" y2="478"/>
    <line x1="962" y1="730" x2="998" y2="730"/>
  </g>
  <g font-family="Segoe UI,Microsoft YaHei,sans-serif">
    <text x="1010" y="300" font-size="84" fill="#283128">1.618</text>
    <text x="1010" y="660" font-size="84" fill="#818879">1</text>
  </g>
</svg>