<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="t d"><title id="t">弧线基线：逐字转到切线角</title><desc id="d">五个字母的下缘落在一条圆弧上，每个字绕自己的基线点转到所在位置的切线角，首尾落在同一条虚线弦上</desc><rect width="1280" height="800" fill="#e7e9df"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><path d="M640 527V330" stroke="#dc7858" stroke-width="10" fill="none"/><path d="M154 527H1126" stroke="#c3cbbb" stroke-width="6" stroke-dasharray="26 20" fill="none"/><g fill="#61724f" font-size="260" font-weight="700" text-anchor="middle"><text x="154" y="527" transform="rotate(-44 154 527)">A</text><text x="378" y="381" transform="rotate(-22 378 381)">A</text><text x="640" y="330">A</text><text x="902" y="381" transform="rotate(22 902 381)">A</text><text x="1126" y="527" transform="rotate(44 1126 527)">A</text></g><text x="90" y="690" font-size="100" font-weight="650" fill="#283128">CURVED BASELINE</text><text x="90" y="780" font-size="60" font-weight="600" fill="#818879">EACH GLYPH TURNS TO THE TANGENT</text></g></svg>